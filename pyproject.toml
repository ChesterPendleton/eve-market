[project]
name = "eve-market"
version = "0.1.0"
description = "EVE Online market and trading analysis tool built on ESI"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "asyncpg>=0.29",
    "redis>=5.0",
    "typer>=0.12",
    "rich>=13.7",
    "pyperclip>=1.8",
]

[project.optional-dependencies]
ui = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
eve-market = "eve_market.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eve_market"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: typer declares CLI options via function-call defaults; that's the API.
# DTZ011: date.today() is correct for market history, which is date-only.
# S112: skipping a malformed row in a market export is deliberate; logging
#       every bad line would bury the useful output.
ignore = ["B008", "DTZ011", "S112"]
